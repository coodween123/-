<html lang="ru"><head>

<meta name="description" content="Такой страницы нет. Вернитесь на основной сайт Георгия Андюла.">

<style>
:root{--bg:#0B0B0D;--card:#18181B;--ink:#F4F4F6;--mute:#9A9AA4;--lime:#FFD21F;--on-lime:#131316;--line:#2B2B30}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
.box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;width:min(520px,100%)}
.label{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.scene{position:relative;width:min(380px,100%);height:230px}
.beam{position:absolute;left:0;right:0;top:0;height:10px;border-radius:5px;background:#2F2F34}
.lamp{position:absolute;right:6px;top:-9px;width:14px;height:14px;border-radius:50%;background:#FF7A1A;box-shadow:0 0 14px #FF7A1A;animation:lamp 1s steps(1) infinite}
@keyframes lamp{50%{opacity:.15;box-shadow:none}}
.trolley{position:absolute;top:8px;left:0;width:34px;height:34px;animation:trolley 6s ease-in-out infinite}
@keyframes trolley{0%,100%{transform:translateX(30px)}50%{transform:translateX(240px)}}
.trolley i{position:absolute;left:12px;top:-8px;width:20px;height:12px;border-radius:3px;background:var(--lime)}
.cable{position:absolute;left:22px;top:4px;width:2px;height:70px;background:#9A9AA4;transform-origin:50% 0;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
.cable .hook{position:absolute;left:-7px;bottom:-4px;width:16px;height:10px;border:3px solid #9A9AA4;border-top:0;border-radius:0 0 10px 10px}
.cable .blk{position:absolute;left:-30px;top:76px}
.blk{width:60px;height:60px;border-radius:14px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:800;font-size:38px;letter-spacing:-.04em}
.row{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:12px}
.row .blk{position:relative;animation:bob 2.4s ease-in-out infinite}
.row .blk:nth-child(2){background:#F4F4F6;animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-6px)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,#2F2F34 0 16px,#232327 16px 32px)}
.cone{position:absolute;bottom:14px;width:22px;height:30px;background:#FF7A1A;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.cone.l{left:6px}.cone.r{right:6px}
h1{margin:0;font-size:clamp(30px,6vw,44px);line-height:1.08;letter-spacing:-.035em;font-weight:600;text-wrap:balance}
p{margin:0;color:var(--mute);font-size:16px;max-width:420px;text-wrap:pretty}
.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 26px;border-radius:999px;background:var(--lime);color:var(--on-lime);font-weight:600;font-size:15px;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.lamp,.trolley,.cable,.row .blk{animation:none}.trolley{transform:translateX(120px)}}
</style>
</head><body>
<main><div class="box">
  <div class="label">[ ошибка 404 ]</div>
  <div class="scene" aria-hidden="true">
    <div class="beam"></div><div class="lamp"></div>
    <div class="trolley"><i></i><div class="cable"><span class="hook"></span><div class="blk">4</div></div></div>
    <div class="row"><div class="blk">4</div><div class="blk">0</div></div>
    <div class="cone l"></div><div class="cone r"></div>
    <div class="ground"></div>
  </div>
  <h1>Здесь пока стройка, страницы нет</h1>
  <p>Возможно, адрес набран с&nbsp;ошибкой или страницу уже снесли. Работы ведутся, но&nbsp;основной сайт открыт.</p>
  <a class="btn" href="/site/">На основной сайт →</a>
</div></main>
</body></html>
